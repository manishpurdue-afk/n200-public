const n=(v,d=2)=>(v==null||isNaN(v))?'--':Number(v).toFixed(d);
const inr=(v)=>v==null?'--':'₹'+Math.abs(v).toLocaleString('en-IN',{maximumFractionDigits:0});
const pill=(b)=>{const cls=b==='Defensive'||b==='Pharma'||b==='Finance'||b==='FMCG'||b==='Cement'||b==='Health'||b==='Consumer'||b==='Insurance'?'D':b==='Cyclical'||b==='Metals'||b==='Energy'||b==='Auto'||b==='Infra'?'C':'G';const lbl=cls==='D'?'DEF':cls==='C'?'CYC':'GRW';return`<span class="pill pill-${cls}">${lbl}</span>`};
let charts={};
function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}
function getLTP(p){return p.ltp;}
function renderPublic(){
  const pos=PORTFOLIO.positions;let ti=0,tv=0;
  const rows=pos.map(p=>{const cp=getLTP(p);const cost=p.entry_px*p.shares;const cur=cp*p.shares;const pnl=cur-cost;const pp=(pnl/cost*100);const prt=(cost/PORTFOLIO.capital*100);ti+=cost;tv+=cur;
    const aboveStop=cp>p.trail_stop;
    const isNew=p.is_new;
    const isExit=p.exit_pending;
    let rowStyle='';
    if(isExit) rowStyle=' style="background:#fff1f2"';
    else if(isNew) rowStyle=' style="background:#f0fdf4"';
    else if(!aboveStop) rowStyle=' style="background:#fff7ed"';
    let tag='';
    if(isExit) tag='<span class="exit-tag">⚠️ EXIT</span>';
    else if(isNew) tag='<span class="new-tag">✅ NEW @ open</span>';
    else if(!aboveStop) tag='<span class="watch-tag">⚠️ WATCH</span>';
    else tag='<span class="hold-tag">HOLD</span>';
    return{...p,cp,cost,cur,pnl,pp,prt,aboveStop,isNew,isExit,rowStyle,tag};});
  const tpnl=tv-ti;const tpct=tpnl/ti*100;
  const ct=TRADE_LOG.filter(t=>t.status==='CLOSED'&&t.pnl_pct!=null&&t.type==='SELL');
  const tb=ct.reduce((s,t)=>{const c=t.amount/(1+t.pnl_pct/100);return s+Math.round(c*t.pnl_pct/100);},0);
  const pv=PORTFOLIO.capital+tb+tpnl;
  const cash=pv-tv;
  const pv_idx=(pv/PORTFOLIO.capital*100).toFixed(2);
  const liveBar=`<div class="regime caution" style="border-radius:10px;margin-bottom:12px"><div class="r-label" style="font-size:17px">N200 Momentum Strategy</div><div class="r-sub" style="margin-left:auto;font-size:14px;font-weight:700;opacity:1">🟠 Caution Zone</div></div>`;
  const cards=`<div class="pnl-cards">
    <div class="card"><div class="lbl">Portfolio Value</div><div class="val ${pv>=PORTFOLIO.capital?'g':'r'}">${inr(pv)}</div><div class="sub ${pv>=PORTFOLIO.capital?'g':'r'}">${pv>=PORTFOLIO.capital?'+':''}${(+pv_idx-100).toFixed(2)}% vs ₹1Cr capital</div></div>
    <div class="card"><div class="lbl">Invested</div><div class="val b">${inr(ti)}</div><div class="sub">${(ti/PORTFOLIO.capital*100).toFixed(1)}% deployed</div></div>
    <div class="card"><div class="lbl">Cash</div><div class="val g">${inr(cash)}</div><div class="sub">${(cash/PORTFOLIO.capital*100).toFixed(1)}% idle</div></div>
    <div class="card"><div class="lbl">Open P&amp;L</div><div class="val ${tpnl>=0?'g':'r'}">${tpnl>=0?'+':''}${inr(tpnl)}</div><div class="sub">${tpnl>=0?'+':''}${n(tpct)}%</div></div>
    <div class="card"><div class="lbl">Booked P&amp;L</div><div class="val ${tb>=0?'g':'r'}">${tb>=0?'+':''}${inr(tb)}</div><div class="sub">${ct.length} closed trades</div></div>
    <div class="card"><div class="lbl">Positions</div><div class="val">7<span style="font-size:11px;color:#aaa">/14</span></div><div class="sub" style="color:#16a34a">7 held · 2 exiting</div></div>
  </div>`;
  const trows=rows.map(r=>{const chg=r._chg??null;
    const ls=chg!=null?`<b>${n(r.cp)}</b> <span style="font-size:10px;color:${chg>=0?'#16a34a':'#dc2626'}">${chg>=0?'+':''}${chg.toFixed(2)}%</span>`:`<b>${n(r.cp)}</b>`;
    const stopCol=r.aboveStop?'#16a34a':'#dc2626';
    return`<tr${r.rowStyle}><td class="sym">${r.symbol}${r.isNew?' <span class="new-tag" style="font-size:9px">NEW</span>':r.isExit?' <span class="exit-tag" style="font-size:9px">⚠️EXIT</span>':''}</td><td class="co">${r.company}</td><td>${pill(r.basket)}</td>
    <td class="num">${r.entry_date}</td><td class="num">${n(r.entry_px)}</td><td class="num">${r.shares.toLocaleString('en-IN')}</td>
    <td class="num">${inr(r.cost)}</td><td class="num">${n(r.prt,1)}%</td>
    <td class="num">${ls}</td>
    <td class="num" style="color:${stopCol};font-size:10px"><b>${n(r.trail_stop)}</b></td>
    <td class="num">${inr(r.cur)}</td>
    <td class="num ${r.pnl>=0?'g':'r'}">${r.pnl>=0?'+':''}${inr(r.pnl)}</td>
    <td class="num ${r.pp>=0?'g':'r'}">${r.pp>=0?'+':''}${n(r.pp)}%</td>
    <td>${r.tag}</td></tr>`;}).join('');
  const tfoot=`<tfoot><tr><td colspan="6" style="font-weight:700">TOTAL (${pos.length} positions)</td><td class="num">${inr(ti)}</td><td></td><td colspan="2"></td><td class="num">${inr(tv)}</td>
    <td class="num ${tpnl>=0?'g':'r'}">${tpnl>=0?'+':''}${inr(tpnl)}</td><td class="num ${tpct>=0?'g':'r'}">${tpct>=0?'+':''}${n(tpct)}%</td><td></td></tr></tfoot>`;
  const pendRows=PORTFOLIO.pending_buys.map(b=>`<tr style="background:#fffbeb"><td class="sym">${b.symbol}</td><td class="co">${b.company}</td><td>${pill(b.basket)}</td><td class="num">${n(b.signal_px)}</td><td class="num">${b.shares.toLocaleString('en-IN')}</td><td class="num">${inr(b.signal_px*b.shares)}</td><td class="num" style="color:#555;font-size:10px"><b>${n(b.trail_stop)}</b></td><td><span class="buy-tag">📋 EXEC AT OPEN</span></td></tr>`).join('');
  const aggMap={};
  for(const t of ct){const cost=t.amount/(1+t.pnl_pct/100);const pi=Math.round(cost*t.pnl_pct/100);if(!aggMap[t.symbol])aggMap[t.symbol]={symbol:t.symbol,basket:t.basket,trades:[],totalCost:0,totalPi:0};aggMap[t.symbol].trades.push({...t,_cost:cost,_pi:pi});aggMap[t.symbol].totalCost+=cost;aggMap[t.symbol].totalPi+=pi;}
  let bW=0,bL=0;
  const brows=Object.values(aggMap).map(a=>{const pi=a.totalPi;const pct=pi/a.totalCost*100;if(pi>=0)bW++;else bL++;const pc=pi>=0?'g':'r';
    const sells=a.trades.filter(t=>t.type==='SELL');const buysInCt=a.trades.filter(t=>t.type==='BUY');
    const ep=buysInCt.length?n(buysInCt[buysInCt.length-1].px):'--';
    const xp=sells.length?n(sells[0].px):'--';
    const dates=a.trades.map(t=>t.date).sort();
    const dateStr=dates.length>1?dates[0]+' – '+dates[dates.length-1]:dates[0];
    return`<tr><td class="num" style="font-size:10px;white-space:nowrap">${dateStr}</td><td class="sym">${a.symbol}</td><td>${pill(a.basket)}</td>
      <td class="num">${ep}</td><td class="num">${xp}</td><td class="num">${a.trades.map(t=>t.shares.toLocaleString('en-IN')).join(' + ')}</td>
      <td class="num">${inr(Math.round(a.totalCost))}</td><td class="num ${pc}">${pi>=0?'+':''}${inr(pi)}</td><td class="num ${pc}">${pct>=0?'+':''}${n(pct)}%</td></tr>`;}).join('');
  return`${liveBar}${cards}
  <div class="chart-row chart-2" style="padding-top:0"><div class="chart-box"><h4>Allocation (7 positions)</h4><canvas id="c-alloc" style="max-height:180px"></canvas></div><div class="chart-box"><h4>P&amp;L % per position</h4><canvas id="c-pos-pnl" style="max-height:180px"></canvas></div></div>
  <div class="pnl-table"><div style="font-size:13px;font-weight:700;color:#374151;padding:0 2px 8px;border-bottom:2px solid #e5e7eb">Open Positions</div>
  <div class="pnl-tbl-wrap"><table><thead><tr><th>Symbol</th><th>Company</th><th>Basket</th><th class="num">Entry</th><th class="num">Entry Px</th><th class="num">Shares</th><th class="num">Amount</th><th class="num">%Port</th><th class="num">EOD Close</th><th class="num">Trail Stop</th><th class="num">Cur Val</th><th class="num">P&amp;L ₹</th><th class="num">P&amp;L%</th><th>Status</th></tr></thead><tbody>${trows}</tbody>${tfoot}</table></div></div>
  ${pendRows?`<div class="pnl-table" style="margin-top:16px"><div style="font-size:13px;font-weight:700;color:#374151;padding:0 2px 8px;border-bottom:2px solid #e5e7eb">Queued Buys — pending execution at next open</div>
  <div class="pnl-tbl-wrap"><table><thead><tr><th>Symbol</th><th>Company</th><th>Basket</th><th class="num">Signal Px</th><th class="num">Shares</th><th class="num">Notional</th><th class="num">Stop</th><th>Status</th></tr></thead><tbody>${pendRows}</tbody></table></div></div>`:''}
  <div class="pnl-table" style="margin-top:16px"><div style="display:flex;align-items:baseline;gap:14px;padding:0 2px 8px;border-bottom:2px solid #e5e7eb"><span style="font-size:13px;font-weight:700;color:#374151">Booked P&amp;L</span><span style="font-size:12px;color:${tb>=0?'#16a34a':'#dc2626'};font-weight:700">${tb>=0?'+':''}${inr(tb)}</span><span style="font-size:11px;color:#94a3b8">${bW}W/${bL}L</span></div>
  <div class="pnl-tbl-wrap"><table><thead><tr><th>Exit Date</th><th>Symbol</th><th>Basket</th><th class="num">Entry</th><th class="num">Exit</th><th class="num">Shares</th><th class="num">Cost</th><th class="num">P&amp;L ₹</th><th class="num">P&amp;L%</th></tr></thead><tbody>${brows}</tbody></table></div></div><div style="padding:12px 16px;margin-top:4px;font-size:10.5px;color:#94a3b8;line-height:1.5;border-top:1px solid #eef2f6">Disclaimer: For information only — not investment advice, an offer, or a solicitation. Simulated / paper portfolio: no client capital is managed and no live trades have been executed. Returns are hypothetical and gross of fees, taxes and transaction costs. Simulated and past performance is not indicative of future results; equity investments carry risk of loss.</div>`;}
function initPnLCharts(){const pos=PORTFOLIO.positions;
  const colors=['#3b82f6','#10b981','#8b5cf6','#f59e0b','#ec4899','#06b6d4','#84cc16','#f43f5e'];
  destroyChart('alloc');charts['alloc']=new Chart(document.getElementById('c-alloc'),{type:'doughnut',data:{labels:pos.map(p=>p.symbol),datasets:[{data:pos.map(p=>+(p.entry_px*p.shares).toFixed(0)),backgroundColor:colors,borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10}}}}}});
  destroyChart('pos-pnl');const pnls=pos.map(p=>+((getLTP(p)-p.entry_px)/p.entry_px*100).toFixed(2));
  charts['pos-pnl']=new Chart(document.getElementById('c-pos-pnl'),{type:'bar',data:{labels:pos.map(p=>p.symbol),datasets:[{label:'P&L%',data:pnls,backgroundColor:pnls.map(v=>v>=0?'rgba(22,163,74,0.7)':'rgba(220,38,38,0.7)'),borderColor:pnls.map(v=>v>=0?'#15803d':'#991b1b'),borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>v+'%'}}}}});}
document.getElementById('app').innerHTML='<div class="tbl-panel" style="border-radius:10px">'+renderPublic()+'</div>';
